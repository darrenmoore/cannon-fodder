<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!--
    The icon: the tab favicon, and the home screen icon for an installed PWA.

    Drawn on the same 32px grid and out of the same palette as everything else,
    with no anti-aliasing, because an icon that reads as a modern app beside a
    game that refuses to is the wrong first impression. A helmet, which is the
    one silhouette the original is remembered by.

    WATCH THE PROSE IN HERE. This file is XML, not HTML, and a double hyphen
    inside a comment is a parse error rather than a warning: the browser drops
    the whole document and every img that points at it becomes a broken glyph.
    The house em dash is exactly that character pair, so it cannot be used in
    this file. Written down because it cost a round to find.

    Why it is drawn for 16px rather than for 32. The size that matters is the
    browser tab, and that is 16 device pixels on a 1x display. The first
    version framed the helmet inside a 28px bevelled plate, which left about
    eleven pixels of actual helmet once halved, with a one pixel gold band that
    vanished entirely: a legible 32px icon and an illegible favicon, which is
    the wrong way round.

    So the plate is gone, the helmet fills the grid, and every edge in here
    sits on an even coordinate with an even size. That is the whole trick. At
    16px the browser folds each 2x2 block into one pixel, and a feature that
    straddles the fold is averaged into mud; on even boundaries the halving is
    exact, so the icon at 16px is the icon at 32px with the detail removed
    rather than smeared.
  -->
  <rect width="32" height="32" fill="#10150a"/>

  <!-- dome, brightest at the crown where the light comes from -->
  <rect x="10" y="6"  width="12" height="2" fill="#a8b84f"/>
  <rect x="8"  y="8"  width="16" height="2" fill="#8fa03f"/>
  <rect x="6"  y="10" width="20" height="2" fill="#8fa03f"/>
  <!-- one gold band, the colour the chrome uses for anything that matters -->
  <rect x="6"  y="12" width="20" height="2" fill="#f0d878"/>
  <rect x="6"  y="14" width="20" height="2" fill="#7a8a35"/>

  <!-- the brim, wider than the dome: the half of the shape that says helmet -->
  <rect x="2"  y="16" width="28" height="4" fill="#5f6a2a"/>
  <rect x="2"  y="20" width="28" height="2" fill="#2a3117"/>
  <!-- a head under it, in shadow -->
  <rect x="8"  y="22" width="16" height="4" fill="#161b0b"/>
</svg>
