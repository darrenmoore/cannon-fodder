<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover is what lets the game paint under a notch and a home
      indicator; the safe-area insets in style.css then keep anything readable
      out from under them. interactive-widget stops an on-screen keyboard
      (the Boot Hill rename field) from shoving the whole layout upward.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0d05" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Boots &amp; Bullets</title>
    <!--
      The tab icon. The manifest below lists the same file, but a manifest icon
      is only ever the installed app's -- it is not a favicon fallback in any
      browser, so without this line the tab asked for /favicon.ico, got nothing,
      and showed the generic page glyph.

      SVG rather than .ico or .png because the premise is that there are no
      asset files: this is markup, drawn on the same grid as the sprites.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Only what the loading screen needs. Everything else waits. */
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: #0a0d05; color: #d6dcae;
        font: 20px/1.4 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.18em; text-align: center;
        transition: opacity 0.4s linear;
      }
      #boot.gone { opacity: 0; }
      #boot-brand { margin: 0 0 24px; color: #f0d878; font-size: 20px; }
      /* Four cells, filled whole. A partial cell would have a soft edge. */
      #boot-bar { display: flex; gap: 4px; justify-content: center; margin: 0 auto; }
      #boot-bar i { width: 40px; height: 12px; background: #1e2612; box-shadow: inset 0 0 0 1px #3b4d26; }
      #boot-bar i.on { background: #8aa621; box-shadow: inset 0 0 0 1px #c2d45e; }
      #boot-word { margin: 20px 0 0; color: #8a9668; font-size: 20px; }
      #boot-hint { margin: 10px 0 0; color: #a05040; font-size: 20px; }
      #boot.failed #boot-word { color: #e07050; }
    </style>
    <link rel="stylesheet" href="/style.css" />
    <!--
      Visitor counting. Cookieless and personal-data-free, so there is nothing
      to put behind a consent banner, and it counts nothing at all on localhost
      so development does not pollute the numbers. `async`, and everything that
      calls it (src/analytics.ts) no-ops when it is blocked -- the game must not
      depend on it having loaded.
    -->
    <script
      data-goatcounter="https://cannonfodder.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <!--
      The loading screen, inline on purpose.

      It covers the gap before the bundle arrives, so it cannot be built by
      the bundle and cannot use anything the bundle makes -- not the
      generated chrome face, not the plates, not the logo. Its markup and
      the few styles it needs sit in this file so it paints on the first
      frame the browser draws, with no stylesheet round trip in front of it.

      ui/boot.ts advances it on real milestones and takes it down.
    -->
    <div id="boot">
      <div id="boot-inner">
        <p id="boot-brand">BOOTS &amp; BULLETS</p>
        <div id="boot-bar"><i></i><i></i><i></i><i></i></div>
        <p id="boot-word">BOOT</p>
        <p id="boot-hint"></p>
      </div>
    </div>

    <div id="stage">
      <aside id="hud"></aside>
      <!--
        The canvas's positioning context. The action bar is anchored to this
        rather than to the page, so it lands inside the battlefield on a phone
        and inside the play area beside the sidebar on a desktop.
      -->
      <div id="viewport">
        <canvas id="screen"></canvas>
        <div id="controls"></div>
      </div>
    </div>

    <!--
      Every transition in this game passes through black, and the black has to
      cover the *screen* rather than the battlefield. The fade used to be
      painted on the canvas, which left the sidebar lit over the top of it: the
      map went out and six names and a grenade count stayed on, which reads as a
      rendering fault rather than as an ending. This sits over the stage and
      under the overlay, so the results panel and the briefing arrive on it.
    -->
    <div id="blackout"></div>

    <div id="overlay" hidden><div id="overlay-card"></div></div>
    <div id="sheet" hidden></div>

    <!--
      The front end: the intro and the level select, which are one screen.

      One root, one logo, two panes. Moving between them swaps the pane and
      shrinks the logo; nothing unmounts, which is what makes it seamless
      rather than two screens with a transition between them.

      Every plate and button in here wears the plotted chrome, reaching CSS
      as a sliced border-image via ui/skin.ts.
    -->
    <div id="front" hidden>
      <div id="front-inner">
        <h1 id="front-logo"><span class="fx-sr">Boots &amp; Bullets</span></h1>

        <!-- Small screens get the logo and marching orders, nothing else.
             Shown and hidden purely by the stylesheet's width query, so
             resizing the window in and out of it just works. -->
        <section id="front-mobile" class="fx-pane" aria-hidden="false">
          <p class="fx-mobile-title">This theatre of&nbsp;war is&nbsp;too&nbsp;small</p>
          <p class="fx-mobile-sub">No mobile deployment yet, soldier.<br>
            March to a desktop and report back.</p>
        </section>

        <section id="intro" class="fx-pane">
          <div id="intro-actions"></div>
        </section>

        <section id="select" class="fx-pane" hidden>
          <div id="select-frame">
            <div id="select-head"></div>
            <div id="select-body">
              <nav id="select-rail"></nav>
              <div id="select-list"></div>
            </div>
            <div id="select-foot"></div>
          </div>
        </section>
      </div>

      <!--
        The credit, and the only outbound link in the game.

        Pinned to the bottom of #front rather than dropped in as the last flex
        child of #front-inner: the intro pane centres its contents in the
        viewport, so a flow-positioned footer would sit under the buttons in
        the middle of the screen rather than at the bottom of it, and an auto
        margin to push it down would take the centring with it.

        Deliberately not wearing a plate. Every clickable thing on this screen
        does, and a credit line in the same furniture as PLAY NOW reads as a
        third action.
      -->
      <p id="front-foot">
        <a href="https://inselnova.com/imbf/" target="_blank" rel="noopener noreferrer">IMBF Games</a>
      </p>
    </div>

    <div id="menu" hidden>
      <div id="menu-inner">
        <h1>Boots&nbsp;&amp;&nbsp;Bullets</h1>
        <p class="menu-sub">War has never been so much fun. Pick a mission.</p>
        <div id="menu-actions"></div>
        <div id="menu-difficulty"></div>
        <p id="menu-blurb" class="menu-blurb"></p>
        <div id="menu-list"></div>
        <p class="menu-foot" id="menu-foot"></p>
      </div>
    </div>

    <div id="hill" hidden><div id="hill-inner"></div></div>

    <!--
      A floor under the build-time flag.

      `__DEV__` is substituted by esbuild, and a bundle built without that
      define would otherwise hit an undefined identifier and die at boot with a
      black screen -- which is exactly what a long-running `npm run dev` does
      after the flag is added, since its esbuild context predates it. Declaring
      the global first means an unsubstituted bundle simply runs without dev
      features. When the define *is* present nothing reads this.
    -->
    <script>globalThis.__DEV__ = globalThis.__DEV__ ?? false;</script>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
