# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick darrenmoore/cannon-fodder.
# Render reads this file and creates the service. Nothing here needs secrets.
#
# `region` is the one choice that must be right BEFORE the first deploy: it
# cannot be changed afterwards without recreating the service.
#   region  frankfurt | oregon | ohio | virginia | singapore
#
# `plan` can be changed later, here or in the dashboard under Instance Type:
#   free     spins down after 15 minutes idle, ~30s cold start on the next hit
#   starter  $7/mo, always on -- which is the point of it

services:
  - type: web
    name: cannon-fodder
    runtime: node
    region: frankfurt
    plan: starter
    branch: main

    # The repo root is the working directory. `data/` sits beside `game/`, and
    # server.js reads it as ../data, so the build runs from inside game/.
    buildCommand: cd game && npm ci --include=dev && npm run build
    startCommand: cd game && node server.js

    # /api/version is the app answering, not a static file, so a deploy that
    # boots but cannot serve fails here instead of going live broken. It is
    # also what /release polls to prove a given commit is the one running.
    healthCheckPath: /api/version

    # /release pushes to main and waits for the deploy. This is what starts it.
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "22"
      # server.js binds 127.0.0.1 by default. Render health-checks the port from
      # outside the process, so it has to listen on the wildcard here.
      - key: HOST
        value: 0.0.0.0
      # playwright is a devDependency (screenshot + playtest harnesses only) and
      # `npm ci --include=dev` installs it. Without this its postinstall pulls
      # ~400MB of browsers that the server never launches.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
